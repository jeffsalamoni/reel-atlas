<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Atlas</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0c0c0e;
      --surf:   #13131a;
      --s2:     #1c1c26;
      --s3:     #222230;
      --border: #26262e;
      --text:   #e8e3d8;
      --muted:  #6e6e82;
      --accent: #c9a84c;
      --aglow:  rgba(201,168,76,0.10);
      --red:    #e05a5a;
      --green:  #5ab08a;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 380px; min-width: 380px;
      background: var(--surf);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 10;
    }

    .sidebar-top {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; margin-bottom: 2px; }
    .logo em { font-style: italic; color: var(--accent); }
    .tagline { font-size: 11px; color: var(--muted); font-weight: 300; }

    /* ── INPUT ── */
    .input-section { padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .field-label {
      display: block; font-size: 10px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
    }
    .url-row { display: flex; gap: 8px; }
    .url-input {
      flex: 1; background: var(--s2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
      padding: 8px 12px; outline: none; transition: border-color 0.18s;
    }
    .url-input:focus { border-color: var(--accent); }
    .url-input::placeholder { color: var(--muted); }
    .analyze-btn {
      background: var(--accent); color: #0c0c0e; border: none; border-radius: 8px;
      padding: 8px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: opacity 0.18s, transform 0.1s;
    }
    .analyze-btn:hover:not(:disabled) { opacity: 0.88; }
    .analyze-btn:active:not(:disabled) { transform: scale(0.97); }
    .analyze-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .status-bar {
      margin-top: 9px; font-size: 11.5px; padding: 7px 10px;
      border-radius: 7px; display: none; line-height: 1.45;
    }
    .status-bar.show    { display: block; }
    .status-bar.loading { background: var(--aglow); color: var(--accent); }
    .status-bar.error   { background: rgba(224,90,90,0.12); color: var(--red); }
    .status-bar.success { background: rgba(90,176,138,0.12); color: var(--green); }

    /* ── FILTERS ── */
    .filter-bar {
      padding: 12px 20px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: none;
    }
    .filter-bar.visible { display: block; }
    .filter-label {
      font-size: 10px; font-weight: 600; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block;
    }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .filter-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px 3px 8px;
      font-size: 11px; font-weight: 500; color: var(--muted);
      cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .filter-pill:hover { border-color: var(--accent); color: var(--text); }
    .filter-pill.active {
      background: var(--aglow); border-color: var(--accent);
      color: var(--accent);
    }

    /* ── LIST HEADER ── */
    .list-header { padding: 12px 20px 8px; flex-shrink: 0; }
    .list-label { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }

    /* ── REEL LIST ── */
    .reel-list { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
    .reel-list::-webkit-scrollbar { width: 3px; }
    .reel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .empty-state { text-align: center; padding: 36px 16px; color: var(--muted); }
    .empty-icon  { font-size: 28px; margin-bottom: 10px; opacity: 0.5; }
    .empty-state p { font-size: 12.5px; line-height: 1.65; }

    /* ── REEL CARD ── */
    .reel-card {
      background: var(--s2); border: 1px solid var(--border); border-radius: 10px;
      padding: 0; margin-bottom: 8px; overflow: hidden;
      transition: border-color 0.18s;
      animation: fadeUp 0.28s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reel-card:hover { border-color: rgba(201,168,76,0.35); }

    .reel-card-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px 8px; cursor: pointer;
    }
    .plat-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.9px; text-transform: uppercase;
      color: var(--muted); background: var(--bg); padding: 2px 8px;
      border-radius: 20px; border: 1px solid var(--border); flex-shrink: 0;
    }
    .pdot { width: 5px; height: 5px; border-radius: 50%; }
    .pdot.tiktok    { background: #ff0050; }
    .pdot.instagram { background: #c13584; }
    .card-url {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    }

    /* ── LOCATION ROWS ── */
    .loc-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 12px; border-top: 1px solid var(--border);
      cursor: pointer; transition: background 0.15s;
    }
    .loc-row:hover { background: rgba(255,255,255,0.02); }
    .loc-row.filtered-out { display: none; }

    .loc-icon {
      font-size: 18px; flex-shrink: 0; margin-top: 1px;
      width: 28px; text-align: center;
    }
    .loc-body { flex: 1; min-width: 0; }
    .loc-name {
      font-size: 13px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .loc-category {
      font-size: 10px; font-weight: 600; letter-spacing: 0.7px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
    }
    .loc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .loc-rating {
      display: flex; align-items: center; gap: 3px;
      font-size: 11.5px; font-weight: 600; color: var(--accent);
    }
    .loc-rating-count { font-size: 10.5px; color: var(--muted); font-weight: 400; }
    .loc-address {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 200px;
    }
    .loc-maps-link {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10.5px; color: var(--accent); text-decoration: none;
      font-weight: 500; white-space: nowrap; margin-top: 4px;
    }
    .loc-maps-link:hover { text-decoration: underline; }

    /* ── MAP ── */
    #map { flex: 1; z-index: 1; }

    /* ── LEAFLET POPUP ── */
    .leaflet-popup-content-wrapper {
      background: var(--surf) !important; border: 1px solid var(--border) !important;
      border-radius: 12px !important; box-shadow: 0 10px 36px rgba(0,0,0,0.6) !important;
      padding: 0 !important;
    }
    .leaflet-popup-tip { background: var(--surf) !important; }
    .leaflet-popup-content { margin: 0 !important; font-family: 'DM Sans', sans-serif !important; width: 240px !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; top: 10px !important; right: 12px !important; }

    .popup-inner { padding: 14px 16px; }
    .popup-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .popup-icon { font-size: 22px; flex-shrink: 0; }
    .popup-head { flex: 1; min-width: 0; }
    .popup-name {
      font-family: 'Playfair Display', serif; font-size: 15px;
      color: var(--text); line-height: 1.25; margin-bottom: 2px;
    }
    .popup-cat { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
    .popup-rating {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 6px;
    }
    .popup-rating-count { font-size: 11px; color: var(--muted); font-weight: 400; }
    .popup-address { font-size: 11px; color: var(--muted); line-height: 1.4; margin-bottom: 10px; }
    .popup-links { display: flex; gap: 8px; }
    .popup-maps-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--aglow); border: 1px solid rgba(201,168,76,0.25);
      color: var(--accent); font-size: 11px; font-weight: 600;
      padding: 5px 10px; border-radius: 6px; text-decoration: none;
      transition: background 0.15s;
    }
    .popup-maps-btn:hover { background: rgba(201,168,76,0.2); }
    .popup-source-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--s2); border: 1px solid var(--border);
      color: var(--muted); font-size: 11px; font-weight: 500;
      padding: 5px 10px; border-radius: 6px; text-decoration: none;
      transition: background 0.15s;
    }
    .popup-source-btn:hover { background: var(--s3); color: var(--text); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin {
      display: inline-block; width: 11px; height: 11px;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }

    /* Stars */
    .stars { letter-spacing: -1px; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-top">
    <div class="logo">Reel <em>Atlas</em></div>
    <div class="tagline">Map every place you discover on social media</div>
  </div>

  <div class="input-section">
    <label class="field-label">TikTok or Instagram URL</label>
    <div class="url-row">
      <input id="urlInput" class="url-input" type="text" placeholder="Paste link here…" />
      <button id="analyzeBtn" class="analyze-btn" onclick="analyze()">Map It</button>
    </div>
    <div class="status-bar" id="statusBar"></div>
  </div>

  <div class="filter-bar" id="filterBar">
    <span class="filter-label">Filter by category</span>
    <div class="filter-pills" id="filterPills"></div>
  </div>

  <div class="list-header">
    <span class="list-label" id="countLabel">0 Reels Indexed</span>
  </div>

  <div class="reel-list" id="reelList">
    <div class="empty-state">
      <div class="empty-icon">🗺️</div>
      <p>Paste a TikTok or Instagram link above to start mapping locations.</p>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
  // ── State ─────────────────────────────────────────────
  const reels       = [];
  const allMarkers  = [];   // { marker, category, reelIndex, locIndex }
  const activeFilters = new Set(['all']);
  let map;

  // ── Category Config ───────────────────────────────────
  const CATEGORIES = {
    restaurant: { label: 'Restaurant',  emoji: '🍽️',  color: '#e8734a' },
    cafe:       { label: 'Café',        emoji: '☕',  color: '#c9a84c' },
    bar:        { label: 'Bar',         emoji: '🍸',  color: '#9b6dff' },
    landmark:   { label: 'Landmark',    emoji: '🏛️',  color: '#4a9de8' },
    nature:     { label: 'Nature',      emoji: '🌿',  color: '#5ab08a' },
    hotel:      { label: 'Hotel',       emoji: '🏨',  color: '#e85d9b' },
    shopping:   { label: 'Shopping',    emoji: '🛍️',  color: '#f0c040' },
    beach:      { label: 'Beach',       emoji: '🏖️',  color: '#4ac9d4' },
    area:       { label: 'Area',        emoji: '📍',  color: '#888899' },
    place:      { label: 'Place',       emoji: '📌',  color: '#888899' },
  };

  function categorize(types = []) {
    const t = types;
    if (t.some(x => ['restaurant','food','meal_takeaway','meal_delivery','fast_food'].includes(x)))
      return 'restaurant';
    if (t.some(x => ['cafe','bakery','coffee_shop'].includes(x)))
      return 'cafe';
    if (t.some(x => ['bar','night_club','liquor_store'].includes(x)))
      return 'bar';
    if (t.some(x => ['tourist_attraction','museum','art_gallery','church','place_of_worship','monument','historic_site'].includes(x)))
      return 'landmark';
    if (t.some(x => ['park','natural_feature','campground','national_park'].includes(x)))
      return 'nature';
    if (t.some(x => ['lodging'].includes(x)))
      return 'hotel';
    if (t.some(x => ['shopping_mall','store','clothing_store','department_store','supermarket'].includes(x)))
      return 'shopping';
    if (t.some(x => ['beach'].includes(x)))
      return 'beach';
    if (t.some(x => ['locality','neighborhood','sublocality','political','administrative_area_level_1'].includes(x)))
      return 'area';
    return 'place';
  }

  function renderStars(rating) {
    if (!rating) return '';
    const full  = Math.floor(rating);
    const half  = rating - full >= 0.5 ? 1 : 0;
    const empty = 5 - full - half;
    return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
  }

  function formatCount(n) {
    if (!n) return '';
    if (n >= 1000) return `(${(n / 1000).toFixed(1)}k)`;
    return `(${n})`;
  }

  // ── Map Init ──────────────────────────────────────────
  function initMap() {
    map = L.map('map', { center: [25, 10], zoom: 2 });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 19
    }).addTo(map);
  }

  // ── Marker Icon ───────────────────────────────────────
  function markerIcon(categoryKey, platform) {
    const cat   = CATEGORIES[categoryKey] || CATEGORIES.place;
    const pcolor = platform === 'tiktok' ? '#ff0050' : '#c13584';
    return L.divIcon({
      html: `<div style="position:relative;width:36px;height:36px;">
        <div style="
          position:absolute;inset:0;
          background:${cat.color};
          border:2.5px solid white;
          border-radius:50%;
          box-shadow:0 3px 12px rgba(0,0,0,0.45);
          display:flex;align-items:center;justify-content:center;
          font-size:16px;
        ">${cat.emoji}</div>
        <div style="
          position:absolute;bottom:-2px;right:-2px;
          width:11px;height:11px;border-radius:50%;
          background:${pcolor};border:1.5px solid #0c0c0e;
        "></div>
      </div>`,
      iconSize:   [36, 36],
      iconAnchor: [18, 18],
      className:  ''
    });
  }

  // ── Popup HTML ────────────────────────────────────────
  function popupHTML(loc, reel) {
    const cat = CATEGORIES[loc.categoryKey] || CATEGORIES.place;
    const rating = loc.place.rating
      ? `<div class="popup-rating">
           <span class="stars" style="color:var(--accent)">${renderStars(loc.place.rating)}</span>
           <span>${loc.place.rating.toFixed(1)}</span>
           <span class="popup-rating-count">${formatCount(loc.place.ratingCount)}</span>
         </div>`
      : '';
    return `
      <div class="popup-inner">
        <div class="popup-top">
          <div class="popup-icon">${cat.emoji}</div>
          <div class="popup-head">
            <div class="popup-name">${loc.place.name}</div>
            <div class="popup-cat">${cat.label}</div>
          </div>
        </div>
        ${rating}
        <div class="popup-address">${loc.place.address}</div>
        <div class="popup-links">
          <a class="popup-maps-btn" href="${loc.place.mapsUrl}" target="_blank">📍 Google Maps</a>
          <a class="popup-source-btn" href="${reel.url}" target="_blank">▶ Video</a>
        </div>
      </div>`;
  }

  // ── Add Markers ───────────────────────────────────────
  function addMarkersForReel(reel, reelIndex) {
    reel.locations.forEach((loc, locIndex) => {
      const marker = L.marker([loc.place.lat, loc.place.lon], {
        icon: markerIcon(loc.categoryKey, reel.platform)
      })
        .addTo(map)
        .bindPopup(popupHTML(loc, reel), { maxWidth: 260 });

      allMarkers.push({ marker, category: loc.categoryKey, reelIndex, locIndex });
    });
  }

  // ── Filters ───────────────────────────────────────────
  function getAllCategories() {
    const seen = new Set();
    reels.forEach(r => r.locations.forEach(l => seen.add(l.categoryKey)));
    return [...seen];
  }

  function renderFilters() {
    const bar   = document.getElementById('filterBar');
    const pills = document.getElementById('filterPills');
    const cats  = getAllCategories();

    if (!cats.length) { bar.classList.remove('visible'); return; }
    bar.classList.add('visible');

    const allCats = ['all', ...cats];
    pills.innerHTML = allCats.map(key => {
      const isAll = key === 'all';
      const cat   = isAll ? null : CATEGORIES[key];
      const label = isAll ? 'All' : `${cat.emoji} ${cat.label}`;
      const active = activeFilters.has(key) ? 'active' : '';
      return `<span class="filter-pill ${active}" data-key="${key}">${label}</span>`;
    }).join('');

    pills.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => toggleFilter(pill.dataset.key));
    });
  }

  function toggleFilter(key) {
    if (key === 'all') {
      activeFilters.clear();
      activeFilters.add('all');
    } else {
      activeFilters.delete('all');
      if (activeFilters.has(key)) {
        activeFilters.delete(key);
        if (!activeFilters.size) activeFilters.add('all');
      } else {
        activeFilters.add(key);
      }
    }
    applyFilters();
    renderFilters();
  }

  function applyFilters() {
    const showAll = activeFilters.has('all');

    // Map markers
    allMarkers.forEach(({ marker, category }) => {
      if (showAll || activeFilters.has(category)) {
        if (!map.hasLayer(marker)) marker.addTo(map);
      } else {
        if (map.hasLayer(marker)) map.removeLayer(marker);
      }
    });

    // Sidebar location rows
    document.querySelectorAll('.loc-row').forEach(row => {
      const cat = row.dataset.category;
      row.classList.toggle('filtered-out', !showAll && !activeFilters.has(cat));
    });
  }

  // ── Fly To ────────────────────────────────────────────
  function flyTo(reelIndex) {
    const pts = reels[reelIndex].locations.map(l => [l.place.lat, l.place.lon]);
    if (pts.length === 1) map.setView(pts[0], 14, { animate: true });
    else if (pts.length > 1) map.fitBounds(pts, { padding: [60,60], maxZoom: 14, animate: true });
  }

  function flyToLoc(reelIndex, locIndex) {
    const loc = reels[reelIndex].locations[locIndex];
    map.setView([loc.place.lat, loc.place.lon], 15, { animate: true });
    // Open the corresponding marker popup
    const entry = allMarkers.find(m => m.reelIndex === reelIndex && m.locIndex === locIndex);
    if (entry) entry.marker.openPopup();
  }

  // ── Render List ───────────────────────────────────────
  function renderList() {
    const list  = document.getElementById('reelList');
    const label = document.getElementById('countLabel');
    const total = reels.reduce((sum, r) => sum + r.locations.length, 0);
    label.textContent = `${reels.length} Reel${reels.length !== 1 ? 's' : ''} · ${total} Location${total !== 1 ? 's' : ''}`;

    if (!reels.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">🗺️</div><p>Paste a TikTok or Instagram link above to start mapping locations.</p></div>`;
      return;
    }

    list.innerHTML = reels.map((r, ri) => {
      const locRows = r.locations.map((loc, li) => {
        const cat  = CATEGORIES[loc.categoryKey] || CATEGORIES.place;
        const stars = loc.place.rating
          ? `<span class="loc-rating">
               <span class="stars">${renderStars(loc.place.rating)}</span>
               ${loc.place.rating.toFixed(1)}
               <span class="loc-rating-count">${formatCount(loc.place.ratingCount)}</span>
             </span>`
          : '';
        // Extract town: last 2 parts of address
        const addrParts = (loc.place.address || '').split(',');
        const town = addrParts.slice(-2).join(',').trim();

        return `
          <div class="loc-row" data-category="${loc.categoryKey}" onclick="flyToLoc(${ri},${li})">
            <div class="loc-icon">${cat.emoji}</div>
            <div class="loc-body">
              <div class="loc-name">${loc.place.name}</div>
              <div class="loc-category">${cat.label}</div>
              <div class="loc-meta">
                ${stars}
                <span class="loc-address">${town}</span>
              </div>
              <a class="loc-maps-link" href="${loc.place.mapsUrl}" target="_blank" onclick="event.stopPropagation()">
                📍 Google Maps ↗
              </a>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="reel-card">
          <div class="reel-card-header" onclick="flyTo(${ri})">
            <span class="plat-pill"><span class="pdot ${r.platform}"></span>${r.platform}</span>
            <span class="card-url">${r.url}</span>
          </div>
          ${locRows}
        </div>`;
    }).join('');

    renderFilters();
    applyFilters();
  }

  // ── Status ────────────────────────────────────────────
  function setStatus(msg, type) {
    const el = document.getElementById('statusBar');
    el.className = `status-bar show ${type}`;
    el.innerHTML = type === 'loading' ? `<span class="spin"></span>${msg}` : msg;
  }

  // ── Analyze ───────────────────────────────────────────
  async function analyze() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return setStatus('Paste a URL first.', 'error');

    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    setStatus('Fetching caption…', 'loading');

    try {
      const res  = await fetch('/analyze', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      if (!res.ok) { setStatus(data.error || 'Something went wrong.', 'error'); btn.disabled = false; return; }

      if (!data.locations.length) {
        setStatus('No locations found — the video may not mention specific places.', 'error');
        btn.disabled = false;
        return;
      }

      // Attach category key to each location
      data.locations.forEach(loc => {
        loc.categoryKey = categorize(loc.place.types);
      });

      reels.unshift(data);
      addMarkersForReel(data, 0);

      // Re-index markers since we unshifted
      allMarkers.forEach(m => { if (m.reelIndex >= 0) m.reelIndex++; });
      // Reset the ones we just added
      const newCount = data.locations.length;
      for (let i = allMarkers.length - newCount; i < allMarkers.length; i++) {
        allMarkers[i].reelIndex = 0;
      }

      renderList();
      flyTo(0);

      const mapped = data.locations.length;
      setStatus(`✓ ${mapped} location${mapped !== 1 ? 's' : ''} mapped.`, 'success');
      document.getElementById('urlInput').value = '';

    } catch (err) {
      setStatus('Network error — is the server running?', 'error');
    }

    btn.disabled = false;
  }

  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') analyze();
  });

  initMap();
</script>
</body>
</html>

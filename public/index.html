<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Atlas</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0c0c0e;
      --surf:   #13131a;
      --s2:     #1c1c26;
      --border: #26262e;
      --text:   #e8e3d8;
      --muted:  #6e6e82;
      --accent: #c9a84c;
      --aglow:  rgba(201,168,76,0.11);
      --red:    #e05a5a;
      --green:  #5ab08a;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; }

    /* SIDEBAR */
    .sidebar {
      width: 360px; min-width: 360px;
      background: var(--surf);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 10;
    }
    .sidebar-top {
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 600; margin-bottom: 3px; }
    .logo em { font-style: italic; color: var(--accent); }
    .tagline { font-size: 11.5px; color: var(--muted); font-weight: 300; }

    /* INPUT */
    .input-section { padding: 18px 22px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .field-label {
      display: block; font-size: 10.5px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 7px;
    }
    .url-row { display: flex; gap: 8px; }
    .url-input {
      flex: 1;
      background: var(--s2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
      padding: 9px 12px; outline: none; transition: border-color 0.18s;
    }
    .url-input:focus { border-color: var(--accent); }
    .url-input::placeholder { color: var(--muted); }
    .analyze-btn {
      background: var(--accent); color: #0c0c0e; border: none; border-radius: 8px;
      padding: 9px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: opacity 0.18s, transform 0.1s;
    }
    .analyze-btn:hover:not(:disabled) { opacity: 0.88; }
    .analyze-btn:active:not(:disabled) { transform: scale(0.97); }
    .analyze-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .status-bar {
      margin-top: 10px; font-size: 12px; padding: 8px 11px;
      border-radius: 7px; display: none; line-height: 1.45;
    }
    .status-bar.show    { display: block; }
    .status-bar.loading { background: var(--aglow); color: var(--accent); }
    .status-bar.error   { background: rgba(224,90,90,0.12); color: var(--red); }
    .status-bar.success { background: rgba(90,176,138,0.12); color: var(--green); }

    /* LIST */
    .list-header { padding: 14px 22px 10px; flex-shrink: 0; }
    .list-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
    .reel-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
    .reel-list::-webkit-scrollbar { width: 3px; }
    .reel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .empty-state { text-align: center; padding: 36px 16px; color: var(--muted); }
    .empty-icon  { font-size: 30px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state p { font-size: 12.5px; line-height: 1.65; }

    .reel-card {
      background: var(--s2); border: 1px solid var(--border); border-radius: 10px;
      padding: 13px 14px; margin-bottom: 7px; cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      animation: fadeUp 0.28s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reel-card:hover { border-color: rgba(201,168,76,0.4); background: var(--aglow); }

    .card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
    .plat-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.9px; text-transform: uppercase;
      color: var(--muted); background: var(--bg); padding: 2px 8px;
      border-radius: 20px; border: 1px solid var(--border); flex-shrink: 0;
    }
    .pdot { width: 5px; height: 5px; border-radius: 50%; }
    .pdot.tiktok    { background: #ff0050; }
    .pdot.instagram { background: #c13584; }

    .card-url {
      font-size: 11.5px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    }
    .loc-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .loc-tag {
      background: var(--aglow); color: var(--accent);
      border: 1px solid rgba(201,168,76,0.2); border-radius: 4px;
      padding: 2px 8px; font-size: 11px; font-weight: 500;
    }
    .loc-tag.miss { background: rgba(110,110,130,0.1); color: var(--muted); border-color: var(--border); }

    .caption-preview {
      font-size: 11px; color: var(--muted); margin-bottom: 8px;
      line-height: 1.45; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* MAP */
    #map { flex: 1; z-index: 1; }

    /* Leaflet popup overrides */
    .leaflet-popup-content-wrapper {
      background: var(--surf) !important; border: 1px solid var(--border) !important;
      border-radius: 10px !important; box-shadow: 0 8px 30px rgba(0,0,0,0.55) !important;
    }
    .leaflet-popup-tip { background: var(--surf) !important; }
    .leaflet-popup-content { margin: 0 !important; font-family: 'DM Sans', sans-serif !important; }
    .popup-inner { padding: 14px 16px; }
    .popup-plat  { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .popup-loc   { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--text); margin-bottom: 8px; line-height: 1.3; }
    .popup-link  { font-size: 11px; color: var(--accent); text-decoration: none; word-break: break-all; display: block; }
    .popup-link:hover { text-decoration: underline; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin {
      display: inline-block; width: 11px; height: 11px;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-top">
    <div class="logo">Reel <em>Atlas</em></div>
    <div class="tagline">Map every place you discover on social media</div>
  </div>

  <div class="input-section">
    <label class="field-label">TikTok or Instagram URL</label>
    <div class="url-row">
      <input id="urlInput" class="url-input" type="text" placeholder="Paste link here…" />
      <button id="analyzeBtn" class="analyze-btn" onclick="analyze()">Map It</button>
    </div>
    <div class="status-bar" id="statusBar"></div>
  </div>

  <div class="list-header">
    <span class="list-label" id="countLabel">0 Reels Indexed</span>
  </div>

  <div class="reel-list" id="reelList">
    <div class="empty-state">
      <div class="empty-icon">🗺️</div>
      <p>Paste a TikTok or Instagram link above to start mapping locations.</p>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
  const reels = [];
  let map;

  function initMap() {
    map = L.map('map', { center: [25, 10], zoom: 2 });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO',
      subdomains: 'abcd', maxZoom: 19
    }).addTo(map);
  }

  function setStatus(msg, type) {
    const el = document.getElementById('statusBar');
    el.className = `status-bar show ${type}`;
    el.innerHTML = type === 'loading' ? `<span class="spin"></span>${msg}` : msg;
  }

  function markerIcon(platform) {
    const color = platform === 'tiktok' ? '#ff0050' : '#c13584';
    return L.divIcon({
      html: `<div style="
        width:24px;height:24px;background:${color};
        border:2.5px solid white;border-radius:50% 50% 50% 0;
        transform:rotate(-45deg);box-shadow:0 3px 10px rgba(0,0,0,0.45);
      "></div>`,
      iconSize: [24,24], iconAnchor: [12,24], className: ''
    });
  }

  function addMarkers(reel) {
    reel.locations.forEach(loc => {
      if (!loc.coords) return;
      L.marker([loc.coords.lat, loc.coords.lon], { icon: markerIcon(reel.platform) })
        .addTo(map)
        .bindPopup(`
          <div class="popup-inner">
            <div class="popup-plat">${reel.platform}</div>
            <div class="popup-loc">${loc.name}</div>
            <a class="popup-link" href="${reel.url}" target="_blank">Open video ↗</a>
          </div>`);
    });
  }

  function flyTo(index) {
    const pts = reels[index].locations
      .filter(l => l.coords)
      .map(l => [l.coords.lat, l.coords.lon]);
    if (pts.length === 1) map.setView(pts[0], 13, { animate: true });
    else if (pts.length > 1) map.fitBounds(pts, { padding: [60,60], maxZoom: 14, animate: true });
  }

  function renderList() {
    const list = document.getElementById('reelList');
    document.getElementById('countLabel').textContent =
      `${reels.length} Reel${reels.length !== 1 ? 's' : ''} Indexed`;

    if (!reels.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">🗺️</div><p>Paste a TikTok or Instagram link above to start mapping locations.</p></div>`;
      return;
    }

    list.innerHTML = reels.map((r, i) => `
      <div class="reel-card" onclick="flyTo(${i})">
        <div class="card-top">
          <span class="plat-pill"><span class="pdot ${r.platform}"></span>${r.platform}</span>
          <span class="card-url">${r.url}</span>
        </div>
        ${r.caption ? `<div class="caption-preview">${r.caption}</div>` : ''}
        <div class="loc-tags">
          ${r.locations.length
            ? r.locations.map(l => `<span class="loc-tag ${l.coords ? '' : 'miss'}">${l.name}</span>`).join('')
            : `<span class="loc-tag miss">No locations found in caption</span>`}
        </div>
      </div>`
    ).join('');
  }

  async function analyze() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return setStatus('Paste a URL first.', 'error');

    const btn = document.getElementById('analyzeBtn');
    btn.disabled = true;
    setStatus('Fetching caption…', 'loading');

    try {
      const res  = await fetch('/analyze', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ url })
      });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.error || 'Something went wrong.', 'error');
        btn.disabled = false;
        return;
      }

      if (!data.locations.length) {
        setStatus('No locations found in this caption — the video may not mention specific places.', 'error');
        btn.disabled = false;
        return;
      }

      reels.unshift(data);
      addMarkers(data);
      renderList();
      flyTo(0);

      const mapped = data.locations.filter(l => l.coords).length;
      setStatus(`✓ ${mapped} location${mapped !== 1 ? 's' : ''} mapped.`, 'success');
      document.getElementById('urlInput').value = '';

    } catch (err) {
      setStatus('Network error — is the server running?', 'error');
    }

    btn.disabled = false;
  }

  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') analyze();
  });

  initMap();
</script>
</body>
</html>
